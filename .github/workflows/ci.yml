# TP CI: PR 마다 바뀐 서비스만 lint·test 후 Docker 이미지 빌드까지 확인한다 (레지스트리 push 없음).
# 배포(CD)는 보류 → 맥미니에서 scripts/deploy-macmini.sh 로 수동 배포.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: 변경된 서비스 확인
    runs-on: ubuntu-latest
    outputs:
      fe: ${{ steps.filter.outputs.fe }}
      be: ${{ steps.filter.outputs.be }}
      ai: ${{ steps.filter.outputs.ai }}
      batch: ${{ steps.filter.outputs.batch }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            fe:
              - 'TP_FE/**'
              - '.github/workflows/ci.yml'
            be:
              - 'TP_BE/**'
              - 'db/migration/**'
              - '.github/workflows/ci.yml'
            ai:
              - 'TP_AI/**'
              - '.github/workflows/ci.yml'
            batch:
              - 'TP_BATCH/**'
              - '.github/workflows/ci.yml'

  fe:
    name: FE (lint · test · build · image)
    needs: changes
    if: needs.changes.outputs.fe == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TP_FE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: TP_FE/.node-version
          cache: npm
          cache-dependency-path: TP_FE/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --ci --passWithNoTests
      - run: npm run build
      - uses: docker/setup-buildx-action@v3
      - name: Docker 이미지 빌드
        uses: docker/build-push-action@v6
        with:
          context: TP_FE
          push: false
          tags: tp-fe:ci
          cache-from: type=gha,scope=fe
          cache-to: type=gha,mode=max,scope=fe

  be:
    name: BE (ktlint · test · image)
    needs: changes
    if: needs.changes.outputs.be == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TP_BE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon ktlintCheck
      # Testcontainers 테스트는 러너의 Docker 를 사용한다
      - run: ./gradlew --no-daemon test
      - uses: docker/setup-buildx-action@v3
      - name: Docker 이미지 빌드
        uses: docker/build-push-action@v6
        with:
          context: TP_BE
          build-contexts: db=db
          push: false
          tags: tp-be:ci
          cache-from: type=gha,scope=be
          cache-to: type=gha,mode=max,scope=be

  ai:
    name: AI (문법 검사 · image)
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # 테스트(pytest)가 저장소에 들어오면 여기에 추가한다
      - run: python -m compileall -q TP_AI/app
      - uses: docker/setup-buildx-action@v3
      - name: Docker 이미지 빌드
        uses: docker/build-push-action@v6
        with:
          context: TP_AI
          push: false
          tags: tp-ai:ci
          cache-from: type=gha,scope=ai
          cache-to: type=gha,mode=max,scope=ai

  batch:
    name: BATCH (문법 검사 · image)
    needs: changes
    if: needs.changes.outputs.batch == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q TP_BATCH/app
      - uses: docker/setup-buildx-action@v3
      - name: Docker 이미지 빌드
        uses: docker/build-push-action@v6
        with:
          context: TP_BATCH
          push: false
          tags: tp-batch:ci
          cache-from: type=gha,scope=batch
          cache-to: type=gha,mode=max,scope=batch
