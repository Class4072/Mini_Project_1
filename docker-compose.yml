# TP 전체 서비스 실행 (맥미니 개발 서버 기준)
#
#   cp .env.example .env            # 루트: 포트·태그·FE 빌드 값
#   (각 서비스 폴더의 .env 도 준비: TP_BE/.env, TP_AI/.env, TP_BATCH/.env)
#   docker compose up -d --build
#
# 컨테이너 밖(맥미니 호스트)에서 도는 것: PostgreSQL(pgvector), Ollama
#   → 컨테이너에서는 host.docker.internal 로 접근한다.
# 서비스 폴더 .env 의 값은 그대로 쓰되, 컨테이너끼리 통신에 필요한 주소만 아래 environment 에서 덮어쓴다.

name: tp

x-host-gateway: &host-gateway
  extra_hosts:
    - "host.docker.internal:host-gateway"   # Docker Desktop(맥)에서는 기본 제공, Linux 호환용

services:
  fe:
    build:
      context: ./TP_FE
      args:
        VITE_KAKAO_MAP_API_KEY: ${VITE_KAKAO_MAP_API_KEY:-}
        VITE_USE_MOCK: ${VITE_USE_MOCK:-false}
    image: tp-fe:${TAG:-dev}
    environment:
      BACKEND_URL: http://be:8080
    ports:
      - "${FE_PORT:-80}:80"
    depends_on:
      - be
    restart: unless-stopped

  be:
    build:
      context: ./TP_BE
      additional_contexts:
        db: ./db            # Flyway 마이그레이션 SQL (TP_BE/Dockerfile 참고)
    image: tp-be:${TAG:-dev}
    <<: *host-gateway
    env_file:
      - path: ./TP_BE/.env
        required: false
    environment:
      DATABASE_URL: ${BE_DATABASE_URL:-jdbc:postgresql://host.docker.internal:5432/tour_db}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""    # compose 내부 네트워크 전용 Redis (외부 포트 미공개)
      AI_SERVICE_BASE_URL: http://ai:8000
    ports:
      - "${BE_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_started
      ai:
        condition: service_started
    restart: unless-stopped

  ai:
    build:
      context: ./TP_AI
    image: tp-ai:${TAG:-dev}
    <<: *host-gateway
    env_file:
      - path: ./TP_AI/.env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      # AI 는 접속 정보가 URL 하나에 들어 있어 호스트만 바꿀 수 없다 → 루트 .env 에 컨테이너용 URL 을 따로 둔다
      DATABASE_URL: ${AI_DATABASE_URL:?루트 .env 에 AI_DATABASE_URL 을 설정하세요 (.env.example 참고)}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      EMBEDDING_DEVICE: cpu
    volumes:
      - hf_cache:/cache/huggingface
    ports:
      - "${AI_PORT:-8000}:8000"
    restart: unless-stopped

  batch:
    build:
      context: ./TP_BATCH
    image: tp-batch:${TAG:-dev}
    <<: *host-gateway
    env_file:
      - path: ./TP_BATCH/.env
        required: false
    environment:
      DB_HOST: ${BATCH_DB_HOST:-host.docker.internal}
      EMBEDDING_DEVICE: cpu
    volumes:
      - hf_cache:/cache/huggingface
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]   # 캐시 용도라 디스크 저장 안 함
    restart: unless-stopped

volumes:
  hf_cache:   # 임베딩 모델 다운로드 캐시 (AI·배치 공유)
